global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: finpilot-api
    metrics_path: /metrics
    static_configs:
      # The API runs on the host (uvicorn, port 8010), outside this container network.
      - targets: ["host.docker.internal:8010"]
