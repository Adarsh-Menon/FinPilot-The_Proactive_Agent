name: Development checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: finpilot_test
          POSTGRES_PASSWORD: local-integration-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d finpilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FINPILOT_TEST_POSTGRES_ADMIN_URL: postgresql+psycopg://postgres:local-integration-test-only@127.0.0.1:5432/finpilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: node scripts/prompt-versions.mjs validate
      - run: node --test tests/prompt-versions.test.mjs
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
